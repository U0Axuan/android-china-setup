name: "推荐开源 Android 应用"
description: "登录 GitHub 并提交原作者 GitHub 仓库链接，申请加入应用目录"
title: "[应用推荐] "
labels: ["app-suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        感谢推荐！**提交需要登录 GitHub，必须填写原作者的 GitHub 源码仓库地址（https://github.com/owner/repo）**，不接受网盘、APK 直链、个人转载仓库或只有官网的项目。请先搜索现有应用目录及 Issues，避免重复提交。

        收录要求：源代码完整公开、有明确开源许可证；发布版本可从开源平台追溯；近 6 个月有真实维护记录；有基础安全检查依据。自动检查只会提示风险，不等于安全背书。
  - type: input
    id: name
    attributes:
      label: 应用名称
      placeholder: 例如 LocalSend
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: 原作者 GitHub 源代码仓库地址（必填）
      description: 必须为完整的 https://github.com/owner/repo；请勿填 Releases、镜像、Fork、网站或 APK 下载链接
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 建议分类
      options:
        - 日常与效率
        - 游戏与影音
        - 网络与连接
        - 应用与文件
        - 系统与调试
        - 高级与 Root
        - 其他（请在说明中补充）
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 功能简介与推荐理由
      description: 简述 Android 主要功能、优势、适用人群，避免营销宣传
      placeholder: |
        主要功能：
        推荐理由：
        Android 版本兼容情况：
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: 原作者 GitHub Releases 或 Tags 地址
      placeholder: https://github.com/owner/repo/releases
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: 开源许可证链接
      placeholder: https://github.com/owner/repo/blob/main/LICENSE
    validations:
      required: true
  - type: input
    id: recent
    attributes:
      label: 最近 6 个月维护活动链接
      description: 提交、正式发布或开发者实质性维护的记录
      placeholder: https://github.com/owner/repo/commits/main/
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: 安全检查说明
      description: 提供公开 CI、扫描记录或已知问题。没有报告请明确写「尚无可验证扫描报告」，不要声称已通过
      placeholder: |
        扫描依据链接：
        已知安全风险：
        需要的敏感权限：
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交确认
      options:
        - label: 我填写的是原作者的 GitHub 源码仓库，不是二次分发链接
          required: true
        - label: 我已搜索现有目录及 Issue，确认不是重复推荐
          required: true
        - label: 我理解推荐不代表自动收录，维护者将评估开源、安全、更新和下载可信度
          required: true
