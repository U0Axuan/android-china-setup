name: Signed Android Release

# Manual only. Requires protected Actions repository secrets.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (example v0.4.0), matching Android versionName'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate signing secret configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$ANDROID_SIGNING_STORE_PASSWORD"
          test -n "$ANDROID_SIGNING_KEY_ALIAS"
          test -n "$ANDROID_SIGNING_KEY_PASSWORD"
          test ! -f app/release.jks
      - name: Materialize protected key from GitHub Secrets
        shell: bash
        run: |
          set -euo pipefail
          printf %s "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/stable-release.jks"
          chmod 600 "$RUNNER_TEMP/stable-release.jks"
          echo "ANDROID_SIGNING_STORE_FILE=$RUNNER_TEMP/stable-release.jks" >> "$GITHUB_ENV"
      - name: Test and build signed release
        run: gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace
      - name: Validate signing identity, min SDK and version
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | tee /tmp/release-info
          grep -F "sdkVersion:'30'" /tmp/release-info
          tag="${{ inputs.tag }}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${tag#v}"
          grep -F "versionName='$version'" /tmp/release-info
          mkdir -p dist
          cp "$apk" dist/Android-China-Setup.apk
          (cd dist && sha256sum Android-China-Setup.apk > SHA256SUMS.txt)
      - name: Publish verified release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite assets."
            exit 1
          fi
          gh release create "$tag" dist/Android-China-Setup.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Android China Setup $tag" \
            --generate-notes --latest
      - name: Shred temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/stable-release.jks"
