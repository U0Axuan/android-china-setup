name: Publish v0.4.0 after Emulator Tests

on:
  workflow_run:
    workflows: ["Cloud Android Emulator Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-v0.4.0-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: v0.4.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the commit verified in the Android 11 and 15 emulators
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Avoid publishing outdated or already released commits
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$GITHUB_SHA" != "" 
          test "$(git rev-parse HEAD)" = "$current" || {
            echo "This test passed on an older commit; skip to protect Latest."
            exit 1
          }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is already published; refusing to replace APK assets."
            exit 1
          fi
          grep -q 'versionName = "0.4.0"' app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests and compile APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify version, minimum Android and APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | tee /tmp/badging.txt
          grep -F "sdkVersion:'30'" /tmp/badging.txt
          grep -F "versionName='0.4.0'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          mkdir -p dist
          cp "$apk" dist/Android-China-Setup.apk
          (cd dist && sha256sum Android-China-Setup.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Publish release and mark as GitHub Latest
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG"             dist/Android-China-Setup.apk             dist/SHA256SUMS.txt             --repo "$GITHUB_REPOSITORY"             --target "${{ github.event.workflow_run.head_sha }}"             --title "Android China Setup v0.4.0 · 公开测试版"             --notes-file docs/RELEASE_NOTES_v0.4.0.md             --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,isPrerelease,assets
