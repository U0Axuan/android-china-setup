name: Cloud Android Emulator Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/cloud_smoke.py'
      - '.github/workflows/emulator-test.yml'

permissions:
  contents: read

jobs:
  smoke:
    name: Android 35 emulator functional smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build the exact APK under test
        run: gradle :app:assembleDebug --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install APK and exercise UI in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 tests/cloud_smoke.py
      - name: Upload screenshots and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-test-results
          path: test-results/emulator/
          if-no-files-found: warn
      - name: Upload tested APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-tested-apk
          path: app/build/outputs/apk/debug/app-debug.apk
